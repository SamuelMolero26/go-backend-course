services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: social
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      ADDR: ":3000"
      DB_DSN: "postgres://postgres:password@db:5432/social?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:


